name: release

# Push a tag vX.Y.Z (matching pyproject.toml) to publish:
#   - a GitHub Release with the wheel and sdist attached
#   - a container image on GitHub Packages: ghcr.io/maxont/existence-trace
# Run it by hand (workflow_dispatch) to re-publish an existing tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to publish, e.g. v0.1.0"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "$TAG" || { echo "tag $TAG != pyproject version $version"; exit 1; }

      - name: Tests
        run: python -m unittest discover -s tests

      - name: Build wheel and sdist
        run: |
          python -m pip install --quiet build
          python -m build --outdir dist .

      - name: Smoke test the built wheel (fresh venv, the real command)
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          etrace="$RUNNER_TEMP/smoke/bin/etrace"
          "$RUNNER_TEMP/smoke/bin/pip" install --quiet dist/*.whl
          "$etrace" --version
          "$etrace" --pretty --no-color | grep -q "record your traces of existence"
          "$etrace" --pretty --no-color --help | grep -q "The loop"
          "$etrace" init --preset default --dir "$RUNNER_TEMP/smoke-data" --language en --timezone America/Chicago --json
          export ETRACE_CONFIG="$RUNNER_TEMP/smoke-data/trace.toml"
          "$etrace" validate --json | grep -q '"ok": true'
          "$etrace" validate --pretty --no-color | grep -q "All clear"
          "$etrace" prompt daily --raw | grep -q -- "--json"

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "existence-trace ${TAG#v}" --generate-notes
          fi

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Container image on GitHub Packages
        run: |
          image=ghcr.io/maxont/existence-trace
          docker build -t "$image:${TAG#v}" -t "$image:latest" .
          docker run --rm "$image:${TAG#v}" --version
          docker push "$image:${TAG#v}"
          docker push "$image:latest"
