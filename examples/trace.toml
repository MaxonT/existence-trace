# trace.toml — the single configuration file for existence-trace.
# Every key is optional; the values below are the defaults unless noted.
# Unknown keys are an error, so typos are caught early.

# IANA time zone used for task times and journal dates.
timezone = "America/Chicago"

# Where your private data lives (journal, data/*.jsonl, audits, charts).
# "~" expands to your home directory; relative paths resolve against this file's directory.
data_dir = "~/existence-trace-data"

# Starting rules and models: "default" (general) or "tiger-method".
preset = "default"

# Language for prompts, labels and templates: "zh" or "en".
language = "zh"

# How the system reaches you when it has questions or decisions:
#   "note"        write into today's journal note only
#   "note+email"  also send email (requires credentials.email)
outreach = "note"

# Every task commits data_dir to a private local git repository (no change, no commit).
# Nothing is pushed unless you set a remote here; pushes are never forced.
# Unset by default.
# git_remote = "git@example.com:you/private-trace-data.git"

[tasks]
# Daily tasks take "HH:MM" (24h) or a list of times.
calibrate = "09:00"
feedback = ["12:30", "20:30"]
daily = "19:30"
g = "20:30"
# Weekly audit takes "Ddd HH:MM" (Mon Tue Wed Thu Fri Sat Sun).
audit = "Sun 22:15"

[credentials]
# Paths to files holding secrets. Secrets never go in this file or in logs.
# Both are unset by default.
# email = "~/.config/existence-trace/email.toml"
#   The email file is TOML with: address, password, smtp_host, imap_host
#   (optional: smtp_port = 465, smtp_security = "ssl" | "starttls", imap_port = 993,
#   username, user_address, sent_folder = "Sent", inbox = "INBOX", save_to_sent = false).
# notion = "~/.config/existence-trace/notion.toml"
#   Optional Notion mirror (`python3 -m etrace notion push`). The notion file is TOML
#   with: token, parent_page_id (optional: api_version = "2022-06-28", api_url).
#   Local Markdown stays the source of truth; Notion is never read back into notes.

[ai]
# The AI API behind `etrace run` (the built-in agent). Set it up with `etrace ai set`,
# which writes this table for you. The API key is never stored here: only where to find it.
# All keys are unset by default.
# provider = "openai"       # "openai" (any OpenAI-compatible service) or "anthropic"
# model = "pick one with `etrace ai models`"
# base_url = "https://api.openai.com/v1"   # default: the provider's own address
# key_env = "OPENAI_API_KEY"               # name of an environment variable holding the key
# key_file = "~/.config/etrace/ai.toml"    # or a file outside the data folder: key = "..."
